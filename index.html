<!DOCTYPE html>

    <script>
        // 攔截並隱藏 Tailwind CSS CDN 的生產環境警告訊息，保持 Console 乾淨
        (function() {
            var originalWarn = console.warn;
            console.warn = function(...args) {
                if (args[0] && typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com')) {
                    return;
                }
                originalWarn.apply(console, args);
            };
        })();
    </script>
    <script src="./assets/tailwindcss.js"></script>
    <script src="./assets/lucide.js"></script>
    <script src="./assets/xlsx.full.min.js"></script>

    <style>
        @media print {
            @page {
                margin: 1cm;
                size: A4;
            }

            body {
                /* 強制列印背景圖形與顏色 */
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                background-color: white;
            }

            /* 隱藏不需要列印的介面元素 */
            .print\:hidden {
                display: none !important;
            }

            .print\:block {
                display: block !important;
            }

            /* 調整列印時的 Padding */
            .print\:p-6 {
                padding: 1.5rem !important;
            }

            .print\:pb-0 {
                padding-bottom: 0 !important;
            }

            /* 強制列印時表格不被截斷 */
            tr {
                page-break-inside: avoid;
            }

            .page-break-inside-avoid {
                page-break-inside: avoid;
            }
        }

        .drag-active {
            border-color: #374151 !important;
            /* gray-700 */
            background-color: #f3f4f6 !important;
            /* gray-100 */
        }
    </style>
</head>

    <script>
        // --- DOM Elements ---
        const uploadSection = document.getElementById('uploadSection');
        const resultSection = document.getElementById('resultSection');
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileUpload');
        const errorMessage = document.getElementById('errorMessage');
        const printBtn = document.getElementById('printBtn');
        const resetBtn = document.getElementById('resetBtn');
        const demoBtn = document.getElementById('demoBtn');
        const defaultTitle = '新竹市醫事人員年資證明排版工具';

        // Initialize Icons
        lucide.createIcons();
        document.getElementById('currentDate').textContent = new Date().toLocaleDateString('zh-TW');

        // --- Event Listeners ---

        // File Input
        fileInput.addEventListener('change', (e) => processFile(e.target.files[0]));

        // Drag & Drop
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('drag-active');
        });

        dropZone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-active');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-active');
            processFile(e.dataTransfer.files[0]);
        });

        // Buttons
        resetBtn.addEventListener('click', () => {
            resultSection.classList.add('hidden');
            uploadSection.classList.remove('hidden');
            printBtn.classList.add('hidden');
            fileInput.value = ''; // clear input
            document.title = defaultTitle; // Reset title
        });

        printBtn.addEventListener('click', () => {
            setTimeout(() => window.print(), 100);
        });

        demoBtn.addEventListener('click', loadDemoData);

        // --- Core Logic ---

        function processFile(file) {
            if (!file) return;

            document.getElementById('fileNameDisplay').textContent = '來源檔案: ' + file.name;
            errorMessage.classList.add('hidden');

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });
                    parseData(rows);
                } catch (err) {
                    console.error(err);
                    showError('檔案解析失敗，請確認格式是否正確。');
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function showError(msg) {
            errorMessage.textContent = msg;
            errorMessage.classList.remove('hidden');
        }

        function parseData(rows) {
            let personInfo = {
                name: '未知姓名',
                id: '',
                gender: '-',
                dob: '',
                phone: '',
                mobile: '',
                email: '',
                certificateId: ''
            };
            let historyData = [];
            let tableStartIndex = -1;

            // 1. 解析基本資料 (前50行)
            for (let i = 0; i < Math.min(rows.length, 50); i++) {
                const row = rows[i];
                const rowStr = row.map(c => String(c)).join(',');

                // 掃描個人資料區塊
                if (rowStr.includes('姓名(中文)')) {
                    const nameIdx = row.findIndex(c => String(c).includes('姓名(中文)'));
                    const idIdx = row.findIndex(c => String(c).includes('身分證') || String(c).includes('統一證號'));
                    const phoneIdx = row.findIndex(c => String(c).includes('電話'));
                    const mobileIdx = row.findIndex(c => String(c).includes('手機'));
                    const emailIdx = row.findIndex(c => String(c).includes('E-Mail') || String(c).includes('信箱'));
                    const genderIdx = row.findIndex(c => String(c).includes('性別'));
                    const dobIdx = row.findIndex(c => String(c).includes('生日'));

                    if (rows[i + 1]) {
                        const dataRow = rows[i + 1];
                        if (nameIdx !== -1 && dataRow[nameIdx]) personInfo.name = cleanText(dataRow[nameIdx]);
                        if (idIdx !== -1 && dataRow[idIdx]) personInfo.id = cleanText(dataRow[idIdx]);
                        if (phoneIdx !== -1 && dataRow[phoneIdx]) personInfo.phone = cleanText(dataRow[phoneIdx]);
                        if (mobileIdx !== -1 && dataRow[mobileIdx]) personInfo.mobile = cleanText(dataRow[mobileIdx]);
                        if (emailIdx !== -1 && dataRow[emailIdx]) personInfo.email = cleanText(dataRow[emailIdx]);
                        if (genderIdx !== -1 && dataRow[genderIdx]) personInfo.gender = cleanText(dataRow[genderIdx]);
                        if (dobIdx !== -1 && dataRow[dobIdx]) personInfo.dob = cleanText(dataRow[dobIdx]);
                    }
                }

                // 定位表格開始
                if (rowStr.includes('申請日期') && rowStr.includes('申請類別')) {
                    tableStartIndex = i;
                }
            }

            // 2. 解析表格
            if (tableStartIndex !== -1) {
                const headerRow = rows[tableStartIndex];
                const headers = headerRow.map(h => String(h).trim());

                const idxDate = headers.findIndex(h => h.includes('申請日期'));
                const idxType = headers.findIndex(h => h.includes('申請類別'));
                const idxAppr = headers.findIndex(h => h.includes('核准文號'));
                const idxCert = headers.findIndex(h => h.includes('證書字號'));
                const idxStatus = headers.findIndex(h => h.includes('狀態') || h.includes('備註'));
                let idxHosp = headers.findIndex(h => h.includes('執業機構') || h.includes('服務機構') || h.includes('機構名稱'));
                if (idxHosp === -1) idxHosp = 7;
                const idxStartDate = headers.findIndex(h => h.includes('起始日期') || h.includes('執業日期'));
                // 新增：尋找歇業日期或結束日期欄位
                const idxEndDate = headers.findIndex(h => h.includes('歇業日期') || h.includes('結束日期'));

                for (let i = tableStartIndex + 1; i < rows.length; i++) {
                    const row = rows[i];
                    if (!row || row.length === 0) continue;

                    const rowStr = row.map(c => String(c)).join(',');
                    if (rowStr.trim() === '' || rowStr.includes('====') || rowStr.includes('____')) continue;

                    const dateVal = row[idxDate] ? cleanText(row[idxDate]) : '';
                    const typeVal = row[idxType] ? cleanText(row[idxType]) : '';
                    const apprVal = row[idxAppr] ? cleanText(row[idxAppr]) : '';
                    const certVal = (idxCert !== -1 && row[idxCert]) ? cleanText(row[idxCert]) : '';
                    const statusVal = (idxStatus !== -1 && row[idxStatus]) ? cleanText(row[idxStatus]) : '';
                    const hospVal = row[idxHosp] ? cleanText(row[idxHosp]) : '';
                    const startVal = (idxStartDate !== -1 && row[idxStartDate]) ? cleanText(row[idxStartDate]) : dateVal;
                    // 新增：提取歇業日期
                    const endVal = (idxEndDate !== -1 && row[idxEndDate]) ? cleanText(row[idxEndDate]) : '';

                    if (!personInfo.certificateId && certVal) {
                        personInfo.certificateId = certVal;
                    }

                    if (dateVal || typeVal || hospVal) {
                        historyData.push({
                            applyDate: dateVal,
                            type: typeVal,
                            approvalDoc: apprVal,
                            hospital: hospVal,
                            startDate: startVal,
                            endDate: endVal, // 儲存歇業日期
                            status: statusVal
                        });
                    }
                }
            }

            renderUI(personInfo, historyData);
        }

        function cleanText(text) {
            if (text === null || text === undefined) return '';
            return String(text).replace(/"/g, '').trim();
        }

        // --- Date Parsing & Strict Calendar Calculation ---

        // 解析民國年 (e.g., "1120520" or "112/05/20") 為 Date Object
        function parseRocDate(dateStr) {
            if (!dateStr) return null;
            dateStr = String(dateStr).trim();
            if (dateStr.length < 6) return null;

            let year, month, day;
            if (dateStr.includes('/')) {
                const parts = dateStr.split('/');
                year = parseInt(parts[0]) + 1911;
                month = parseInt(parts[1]) - 1;
                day = parseInt(parts[2]);
            } else {
                const yearLen = dateStr.length === 7 ? 3 : 2;
                year = parseInt(dateStr.substring(0, yearLen)) + 1911;
                month = parseInt(dateStr.substring(yearLen, yearLen + 2)) - 1;
                day = parseInt(dateStr.substring(yearLen + 2));
            }

            const date = new Date(year, month, day);
            // 驗證日期是否有效
            if (isNaN(date.getTime())) return null;
            return date;
        }

        // 格式化民國年字串為中文顯示 (例: 1110718 -> 111年07月18日)
        function formatRocDateString(dateStr) {
            if (!dateStr) return '';
            dateStr = String(dateStr).trim();
            if (dateStr.length < 6) return dateStr;

            let year, month, day;
            if (dateStr.includes('/')) {
                const parts = dateStr.split('/');
                year = parts[0];
                month = parts[1];
                day = parts[2];
            } else {
                const yearLen = dateStr.length === 7 ? 3 : 2;
                year = dateStr.substring(0, yearLen);
                month = dateStr.substring(yearLen, yearLen + 2);
                day = dateStr.substring(yearLen + 2);
            }
            return `${year}年${month}月${day}日`;
        }

        // 嚴格依據日曆計算兩個日期的差距 {y, m, d}
        function getStrictDateDiff(startDate, endDate) {
            let years = endDate.getFullYear() - startDate.getFullYear();
            let months = endDate.getMonth() - startDate.getMonth();
            let days = endDate.getDate() - startDate.getDate();

            if (days < 0) {
                months--;
                // 借用上個月的天數
                // 注意：endDate.getMonth() 是當月，我們要找「上個月」有幾天
                // new Date(year, month, 0) 會回傳該月第0天(即上月最後一天)
                let prevMonth = new Date(endDate.getFullYear(), endDate.getMonth(), 0);
                days += prevMonth.getDate();
            }

            if (months < 0) {
                years--;
                months += 12;
            }

            return { years, months, days };
        }

        // 加總年資：依據 30天=1月, 12月=1年 進位
        function addDuration(total, part) {
            let res = {
                years: total.years + part.years,
                months: total.months + part.months,
                days: total.days + part.days
            };

            while (res.days >= 30) {
                res.days -= 30;
                res.months++;
            }
            while (res.months >= 12) {
                res.months -= 12;
                res.years++;
            }
            return res;
        }

        // 扣除年資：依據 30天=1月, 12月=1年 借位
        function subFromTotal(total, deduc) {
            let res = {
                years: total.years - deduc.years,
                months: total.months - deduc.months,
                days: total.days - deduc.days
            };

            while (res.days < 0) {
                res.days += 30;
                res.months--;
            }
            while (res.months < 0) {
                res.months += 12;
                res.years--;
            }
            return res;
        }

        function formatDurationObject(d) {
            if (!d) return "00年00月00日";
            // 確保非負數 (理論上不應該發生，但做個防護)
            const y = Math.max(0, d.years);
            const m = Math.max(0, d.months);
            const day = Math.max(0, d.days);
            
            return `${String(y).padStart(2, '0')}年${String(m).padStart(2, '0')}月${String(day).padStart(2, '0')}日`;
        }

        function processHistory(history) {
            // 1. 解析日期，但不排序，保留原始資料順序
            // 修改：不再過濾掉 dateObj 為 null 的項目，因為要保留在列表中
            let list = history.map(item => ({
                ...item,
                dateObj: parseRocDate(item.applyDate)
            }));

            let totalSeniority = { years: 0, months: 0, days: 0 };

            // 狀態變數
            let activeStartDate = null; // 目前執業開始日
            let activeHospital = null; // 目前執業機構
            let suspendStartDate = null; // 目前停業開始日
            let accumulatedDeduction = { years: 0, months: 0, days: 0 }; // 當次執業期間累積的扣除 YMD

            // 從列表底部 (最舊) 開始遍歷
            for (let i = list.length - 1; i >= 0; i--) {
                const item = list[i];
                const currentDate = item.dateObj;
                const type = item.type;
                const currentHospital = item.hospital;

                item.displayPeriod = null;
                item.displayAccumulated = null;
                item.displaySuspensionDuration = null;

                // 新增：若日期無效，則跳過計算，但資料已保留在 list 中會被 render
                if (!currentDate) {
                    continue;
                }

                if (type.includes('執業') && !type.includes('歇業')) {
                    // 開始執業
                    if (!activeStartDate) {
                        activeStartDate = currentDate;
                        activeHospital = currentHospital;
                        accumulatedDeduction = { years: 0, months: 0, days: 0 };
                        suspendStartDate = null;
                    }
                } else if (type.includes('歇業')) {
                    // 結束執業
                    if (activeStartDate) {
                        if (currentHospital === activeHospital) {
                            // 計算這段總長度 (Gross) - 嚴格曆法計算
                            // 修改：如果歇業日期(endDate)存在，使用歇業日期計算；否則降級使用申請日期(currentDate)
                            let terminationDate = currentDate;
                            if (item.endDate) {
                                const parsedEnd = parseRocDate(item.endDate);
                                if (parsedEnd) {
                                    terminationDate = parsedEnd;
                                }
                            }
                            
                            let gross = getStrictDateDiff(activeStartDate, terminationDate);

                            // 處理未結的停業扣除
                            if (suspendStartDate) {
                                let pendingSusp = getStrictDateDiff(suspendStartDate, terminationDate); // 扣除也要對齊結束日期
                                accumulatedDeduction = addDuration(accumulatedDeduction, pendingSusp);
                                suspendStartDate = null;
                            }

                            // 淨年資 = 總長度 - 扣除額
                            let net = subFromTotal(gross, accumulatedDeduction);
                            
                            // 加到總年資
                            totalSeniority = addDuration(totalSeniority, net);

                            // 紀錄顯示資訊
                            item.displayPeriod = formatDurationObject(net);
                            item.displayAccumulated = formatDurationObject(totalSeniority);

                            // 重置
                            activeStartDate = null;
                            activeHospital = null;
                            accumulatedDeduction = { years: 0, months: 0, days: 0 };
                        }
                    }
                } else if (type.includes('停業')) {
                    if (activeStartDate && !suspendStartDate) {
                        if (currentHospital === activeHospital) {
                            suspendStartDate = currentDate;
                        }
                    }
                } else if (type.includes('復業')) {
                    if (suspendStartDate) {
                        if (currentHospital === activeHospital) {
                            // 計算此次停業時間
                            let suspDuration = getStrictDateDiff(suspendStartDate, currentDate);
                            accumulatedDeduction = addDuration(accumulatedDeduction, suspDuration);

                            // 紀錄顯示
                            item.displaySuspensionDuration = formatDurationObject(suspDuration);
                            
                            suspendStartDate = null;
                        }
                    }
                }
            }

            // 處理最後如果還在執業中 (計算到今天)
            if (activeStartDate) {
                const now = new Date();
                let gross = getStrictDateDiff(activeStartDate, now);
                
                let currentSegmentDeduction = { ...accumulatedDeduction };
                if (suspendStartDate) {
                    let pendingSusp = getStrictDateDiff(suspendStartDate, now);
                    currentSegmentDeduction = addDuration(currentSegmentDeduction, pendingSusp);
                }
                
                let net = subFromTotal(gross, currentSegmentDeduction);
                totalSeniority = addDuration(totalSeniority, net);

                if (list.length > 0) {
                    const lastItem = list[0]; 
                    const isTermination = lastItem.type.includes('歇業');
                    const isSuspension = lastItem.type.includes('停業');
                    
                    if (!isTermination && !isSuspension) {
                        lastItem.displayPeriod = formatDurationObject(net);
                        lastItem.displayAccumulated = formatDurationObject(totalSeniority);
                    }
                }
            }

            return {
                totalString: formatDurationObject(totalSeniority),
                processedList: list
            };
        }

        function renderUI(person, history) {
            // Update Person Info
            document.getElementById('infoName').textContent = person.name;
            document.getElementById('headerName').textContent = person.name;

            // --- 設定網頁標題 (讓列印/PDF 檔名為姓名) ---
            if (person.name && person.name !== '未知姓名') {
                document.title = `${person.name}_年資證明`;
            }

            document.getElementById('infoId').textContent = person.id || '-';
            document.getElementById('headerId').textContent = person.id ? `ID: ${person.id}` : '';
            document.getElementById('infoPhone').textContent = person.phone || '-';
            document.getElementById('infoMobile').textContent = person.mobile || '-';
            document.getElementById('infoEmail').textContent = person.email || '-';

            document.getElementById('infoGenderDob').textContent = `${person.gender || '-'} ${person.dob ? '/ ' + person.dob : ''}`;

            // --- 計算並顯示總年資 ---
            const result = processHistory(history);
            document.getElementById('infoSeniority').textContent = result.totalString;

            document.getElementById('infoCertId').textContent = person.certificateId || '-';

            // Update Table
            const tbody = document.getElementById('historyTableBody');
            tbody.innerHTML = '';

            // 顯示時使用原始順序 (Newest -> Oldest)
            // 這裡不再進行 reverse，因為我們假設檔案本身就是新到舊
            const displayHistory = result.processedList;

            if (displayHistory.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-slate-400">無顯示執業紀錄</td></tr>`;
            } else {
                displayHistory.forEach((item, index) => {
                    const tr = document.createElement('tr');

                    let bgClass = index % 2 === 0 ? 'bg-white' : 'bg-slate-50';
                    tr.className = `border-b border-slate-200 group ${bgClass} hover:bg-slate-100`;

                    // Color Coded Badge Logic
                    let badgeClass = 'bg-slate-100 text-slate-800 border border-slate-300'; // default

                    if (item.type.includes('歇業')) {
                        badgeClass = 'bg-red-100 text-red-800 border border-red-200 font-medium';
                    } else if (item.type.includes('執業')) {
                        badgeClass = 'bg-blue-100 text-blue-800 border border-blue-200 font-medium';
                    } else if (item.type.includes('停業')) {
                        badgeClass = 'bg-yellow-100 text-yellow-800 border border-yellow-200 font-medium';
                    } else if (item.type.includes('變更')) {
                        badgeClass = 'bg-indigo-100 text-indigo-800 border border-indigo-200 font-medium';
                    } else if (['補', '換', '發', '更新'].some(k => item.type.includes(k))) {
                        badgeClass = 'bg-slate-100 text-slate-700 border border-dashed border-slate-400';
                    }

                    // 備註欄位
                    let remarksHtml = '';
                    if (item.status) {
                        const formattedStatus = item.status.replace(/[\r\n]+/g, ' ');
                        remarksHtml += `<div class="text-xs text-gray-700 font-medium">${formattedStatus}</div>`;
                    }
                    if (item.startDate !== item.applyDate && item.startDate) {
                        remarksHtml += `<div class="text-xs text-gray-500 italic">生效: ${item.startDate}</div>`;
                    }
                    // 新增：歇業時顯示歇業日期
                    if (item.type.includes('歇業') && item.endDate) {
                         remarksHtml += `<div class="text-xs text-red-600 font-bold mt-1">歇業日期: ${formatRocDateString(item.endDate)}</div>`;
                    }
                    // 新增：歇業或目前執業中時顯示本次執業時間
                    if (item.displayPeriod) {
                        remarksHtml += `<div class="text-xs mt-1">本次執業: ${item.displayPeriod}</div>`;
                    }
                    // 新增：顯示停業時間
                    if (item.displaySuspensionDuration) {
                        remarksHtml += `<div class="text-xs mt-1 text-gray-600">本次停業: ${item.displaySuspensionDuration}</div>`;
                    }

                    // 累積年資欄位 (Moved to Remarks)
                    if (item.displayAccumulated) {
                        remarksHtml += `<div class="text-xs mt-1 text-blue-600 font-bold">累積年資: ${item.displayAccumulated}</div>`;
                    }

                    tr.innerHTML = `
                        <td class="py-3 px-2 align-top font-mono text-sm text-gray-900">${item.applyDate}</td>
                        <td class="py-3 px-2 align-top whitespace-nowrap">
                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${badgeClass}">
                                ${item.type}
                            </span>
                        </td>
                        <td class="py-3 px-2 align-top text-sm text-gray-600">${item.approvalDoc}</td>
                        <td class="py-3 px-2 align-top text-sm text-gray-900">${item.hospital}</td>
                        <td class="py-3 px-2 align-top text-left text-sm space-y-1">${remarksHtml}</td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            // Re-init icons for the new content
            lucide.createIcons();

            // Switch View
            uploadSection.classList.add('hidden');
            resultSection.classList.remove('hidden');
            printBtn.classList.remove('hidden');
        }
